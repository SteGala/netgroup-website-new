description: >-
  SERICS is Italy's extended national partnership on cybersecurity, funded via the PNRR and NextGenerationEU
  programmes. Operating in a hub-and-spoke model with 30+ universities and research centres, it advances
  research in critical infrastructure protection, network security, AI-based defenses, and digital rights.
  NetGroup contributes through network security, formal verification, and AI-driven threat detection.
